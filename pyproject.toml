[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketguard"
version = "0.1.0"
description = "Coinbase trade processing and statistical anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
screenshots = ["playwright"]

[tool.setuptools]
packages = ["marketguard", "marketguard.spark", "marketguard.kafka", "marketguard.dashboard"]
package-dir = {marketguard = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
