name: MarketGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard-only dependencies
        run: python -m pip install -r deploy/requirements.txt pytest
      - name: Verify bundled public app without pipeline imports or Azure credentials
        run: python -m pytest tests/test_public_deployment.py -v

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Verify Kafka-to-Delta replay and checkpoint recovery
        run: python -m pytest tests/test_kafka_to_delta.py -v

      - name: Run remaining pytest tests
        run: python -m pytest --ignore=tests/test_kafka_to_delta.py

      - name: Run Ruff
        run: ruff check .

  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install local demo dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . pytest
      - name: Verify real Kafka to dashboard pipeline
        env:
          MARKETGUARD_KAFKA_E2E: "1"
        run: .venv/bin/python -m pytest tests/test_demo_e2e.py -v
